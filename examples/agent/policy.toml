# Example policy.toml (agentkit v1.2.0 schema)
#
# A tool is enabled by the presence of a [tools.<name>] table; there is no
# per-tool "enabled" flag. With default_deny = false every tool is available
# and the tables below only add restrictions. Set default_deny = true for
# production and keep only the [tools.*] tables you need.
default_deny = false

# Allowed Directories (Universal Filesystem Boundary)
# ---
# All tools that touch the filesystem (read, write, edit, bash, glob, grep, ls)
# are restricted to these directories. Paths outside are denied.
# Supports $WORKSPACE expansion. If omitted, defaults to workspace only.
# allowed_dirs = ["$WORKSPACE", "/tmp"]

# MCP Tool Security
# ---
# enabled = true, no allow list: all MCP tools allowed (development mode)
# enabled = true + allow: only matching "server:tool" patterns can be called
# enabled = false: no MCP tools at all
[mcp]
enabled = true  # Add an allow list for production
# allow = ["filesystem:read_file", "filesystem:list_directory", "memory:*"]

# Security Patterns and Keywords
# ---
# Extend the built-in security detection with custom patterns and keywords.
# Patterns are regex-based (for injection detection), keywords are simple word matches.
[content.security]
# Extra patterns: format is "name:regex"
# These are checked in addition to built-in patterns like ignore_previous, curl_pipe_bash, etc.
patterns = [
    # Data exfiltration attempts
    "exfil_curl:(?i)curl\\s+.*(-d|--data).*\\$",
    "exfil_wget:(?i)wget\\s+--post",
    "exfil_nc:(?i)(nc|netcat)\\s+-.*\\d+",
    # Privilege escalation
    "sudo_attempt:(?i)sudo\\s+",
    "su_attempt:(?i)\\bsu\\s+-",
    "chmod_dangerous:(?i)chmod\\s+(777|\\+s)",
    # Reverse shells
    "reverse_shell_bash:(?i)bash\\s+-i\\s+>&",
    "reverse_shell_nc:(?i)(nc|netcat)\\s+-e\\s+/bin/(ba)?sh",
    # Environment probing
    "env_dump:(?i)(printenv|env\\s*$|set\\s*$)",
    "aws_creds:(?i)aws\\s+configure|~/.aws/credentials",
    # Remote code loading
    "python_exec:(?i)python.*-c\\s+['\"].*import",
    "node_eval:(?i)node\\s+-e",
]
# Extra keywords: simple case-insensitive word matches
# These are checked in addition to built-in keywords like api_key, password, secret, etc.
keywords = [
    # Classification labels
    "confidential",
    "internal_only",
    "proprietary",
    "do_not_share",
    # Cloud credentials
    "aws_access_key",
    "aws_secret_key",
    "azure_client_secret",
    "gcp_service_account",
    # Database
    "connection_string",
    "db_password",
    "mongodb_uri",
    "postgres_password",
    # Auth tokens
    "bearer_token",
    "refresh_token",
    "jwt_secret",
    "oauth_secret",
    # SSH/TLS
    "ssh_private_key",
    "ssl_key",
    "pem_file",
]

# Web Tool Security
# ---
# `allow` restricts which domains can be fetched (was `allow_domains`).
# The legacy `rate_limit` key has no equivalent and was dropped.
[tools.web_fetch]
# Recommended: restrict to known-good domains in production
# allow = ["github.com", "*.github.io", "docs.python.org", "pkg.go.dev"]

[tools.web_search]

# File Tools
[tools.read]

[tools.write]

[tools.edit]

[tools.glob]

[tools.grep]

[tools.ls]

# Shell
# bash is guarded by shellguard: a built-in banned-command list and
# dangerous-pipe detection, plus the bare command names in `deny`, then an
# optional small-LLM review. Entries are command names, not globs (the legacy
# `denylist`/`allowlist` globs are gone).
[tools.bash]
deny = ["rm", "sudo", "chmod"]

# Memory (v1.2.0 tool names; were memory_read / memory_write)
[tools.recall]

[tools.remember]
