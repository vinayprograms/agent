# Policy for Testing (agentkit v1.2.0 schema)
#
# Permissive: default_deny = false means every tool is available; the tables
# below are explicit for clarity. There is no per-tool "enabled" flag.

default_deny = false

[tools.read]
allow = ["**"]

[tools.write]
allow = ["**"]

[tools.edit]
allow = ["**"]

[tools.glob]
allow = ["**"]

[tools.grep]
allow = ["**"]

[tools.ls]
allow = ["**"]

# The legacy bash `allowlist` has no equivalent: bash is guarded by
# shellguard's built-in deny list (plus any bare command names in `deny`).
[tools.bash]

# `allow` holds domain patterns (was `allow_domains`); `rate_limit` dropped.
[tools.web_fetch]
allow = ["*"]

[tools.web_search]

# v1.2.0 name (was spawn_agent)
[tools.spawn_agents]

# Memory (were memory_read / memory_write)
[tools.recall]

[tools.remember]
