# Agent Configuration — Ollama Cloud

[llm]
provider = "ollama-cloud"
model = "deepseek-v4-pro:cloud"
max_tokens = 65536

[small_llm]
provider = "ollama-cloud"
model = "qwen3.5:cloud"
max_tokens = 4096


# Cloud models can spiral on open-ended research goals; cap each goal.
[limits]
max_tool_calls = 40
max_turns = 25
max_duration = "10m"

[timeouts]
web_fetch = 120
web_search = 60

[web]
# Backend: "auto" (SearXNG > Brave > Tavily > DuckDuckGo) or a pinned provider.
search_provider = "auto"
# searxng_url = "https://searxng.example.com"  # else SEARXNG_URL env is used

[security]
level = "default"
