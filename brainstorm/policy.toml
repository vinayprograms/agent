# policy.toml (agentkit v1.2.0 schema)
#
# A tool is enabled by the presence of a [tools.<name>] table. There is no
# per-tool "enabled" flag: with default_deny = true, unlisted tools are off.

# Global defaults
default_deny = true

[tools.read]
allow = ["$WORKSPACE/**"]
deny = ["~/.ssh/*", "~/.aws/*", "~/.gnupg/*"]

[tools.write]
allow = ["$WORKSPACE/**"]
deny = ["~/.ssh/*", "~/.aws/*", "/etc/*"]

[tools.edit]
allow = ["$WORKSPACE/**"]
deny = ["~/.ssh/*", "~/.aws/*"]

[tools.glob]
allow = ["**"]

[tools.grep]
allow = ["**"]
deny = ["/etc/shadow", "/etc/passwd"]

[tools.ls]
allow = ["**"]

# Shell. The legacy `allowlist` is gone: bash is guarded by shellguard, which
# combines a built-in banned-command list (sudo, su, curl, wget, ...) and
# dangerous-pipe detection with the command names listed in `deny` below, then
# an optional small-LLM review. Entries in `deny` are bare command names
# (matched against the first word of every pipe/chain segment), not globs.
[tools.bash]
deny = ["rm", "sudo", "su"]

# Web. `allow` holds domain patterns (was `allow_domains`). The legacy
# `rate_limit` key has no equivalent and was dropped.
[tools.web_fetch]
allow = ["*"]

[tools.web_search]

# Memory (v1.2.0 tool names; were memory_read / memory_write).
[tools.recall]

[tools.remember]
